<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Neal Chandra — Portfolio</title>
    <!--
      GitHub Pages serves this file for any unknown path (i.e. any direct
      link to /projects/senior-design). It stashes the real path and
      redirects to the site root; index.html's inline script restores it
      so React Router can take over. Standard "spa-github-pages" technique.
    -->
    <script>
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/'" />
  </head>
  <body></body>
</html>
